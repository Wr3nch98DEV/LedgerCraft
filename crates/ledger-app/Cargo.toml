[package]
name = "ledger-app"
version = "0.1.0"
edition = "2024"
description = "LedgerCraft native desktop app (iced)"

[[bin]]
name = "ledgercraft"
path = "src/main.rs"

[dependencies]
ledger-core = { path = "../ledger-core" }
ledger-server = { path = "../ledger-server" }
tokio = { version = "1", features = ["rt", "time"] }
iced = { version = "0.14", features = ["svg", "tokio", "advanced", "qr_code"] }
serde_json = "1"
chrono = "0.4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
iced_test = "0.14"
iced_runtime = "0.14"
